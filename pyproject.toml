[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repomap"
version = "0.1.0"
description = "Scan a codebase and generate a compact CONTEXT.md for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["repomap*"]
